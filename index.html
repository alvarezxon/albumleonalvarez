<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Álbum Mundial 2026 – León Álvarez</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0F0A1E;--bg2:#160D2A;--bg3:#1C1235;
  --blue:#2A398D;--blue-light:#3D52C4;
  --red:#E61D25;--green:#3CAC3B;
  --white:#FFFFFF;--gold:#FFDB00;
  --border:rgba(42,57,141,0.35);
  --ft:'Bebas Neue',sans-serif;
  --fc:'Barlow Condensed',sans-serif;
  --fb:'Barlow',sans-serif;
}
body{font-family:var(--fb);background:var(--bg);min-height:100vh;color:var(--white);}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 50%,#1A1050 100%);border-bottom:3px solid var(--red);padding:18px 20px 14px;position:relative;overflow:hidden;}
.hdr::before{content:'26';font-family:var(--ft);font-size:200px;color:rgba(230,29,37,0.05);position:absolute;right:-10px;top:-30px;line-height:1;pointer-events:none;letter-spacing:-8px;}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--red),var(--blue-light),var(--green),var(--red));opacity:.6;}
.htop{display:flex;align-items:center;gap:14px;margin-bottom:14px;position:relative;}
.logo{width:54px;height:54px;background:linear-gradient(135deg,var(--red),#B01018);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--ft);font-size:10px;color:var(--white);text-align:center;line-height:1.15;flex-shrink:0;border:2px solid rgba(255,255,255,.2);letter-spacing:.5px;}
.htitles h1{font-family:var(--ft);font-size:28px;color:var(--white);letter-spacing:3px;line-height:1;}
.htitles p{font-family:var(--fc);font-size:12px;color:rgba(255,255,255,.45);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
.flag-stripe{display:flex;gap:3px;margin-bottom:12px;}
.fs{height:3px;border-radius:2px;flex:1;}
.sbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.sc{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:9px 10px;text-align:center;}
.sn{font-family:var(--ft);font-size:25px;line-height:1;}
.sl{font-family:var(--fc);font-size:10px;color:rgba(255,255,255,.38);text-transform:uppercase;letter-spacing:.5px;margin-top:1px;}
.pglobal{margin-top:12px;height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
.pfill{height:100%;background:linear-gradient(90deg,var(--red),var(--blue-light),var(--green));border-radius:3px;transition:width .5s ease;}

/* CONTROLS */
.ctrl{padding:11px 20px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.srch{flex:1;min-width:150px;background:rgba(42,57,141,.1);border:1px solid var(--border);border-radius:6px;padding:7px 11px;color:var(--white);font-family:var(--fb);font-size:13px;outline:none;}
.srch::placeholder{color:rgba(255,255,255,.25);}
.srch:focus{border-color:var(--blue-light);}
.csel{background:rgba(42,57,141,.1);border:1px solid var(--border);border-radius:6px;padding:7px 11px;color:var(--white);font-family:var(--fc);font-size:13px;outline:none;cursor:pointer;letter-spacing:.5px;min-width:155px;max-width:200px;}
.csel:focus{border-color:var(--blue-light);}
.csel option{background:#160D2A;color:#fff;}
.fb{background:rgba(42,57,141,.1);border:1px solid rgba(42,57,141,.3);border-radius:6px;padding:7px 12px;color:rgba(255,255,255,.55);font-family:var(--fc);font-size:12px;cursor:pointer;transition:all .15s;letter-spacing:.5px;white-space:nowrap;}
.fb:hover{background:rgba(42,57,141,.25);color:var(--white);}
.fb.active{background:var(--blue);border-color:var(--blue-light);color:var(--white);font-weight:700;}
.fb.red.active{background:var(--red);border-color:var(--red);color:var(--white);font-weight:700;}
.fb.green.active{background:var(--green);border-color:var(--green);color:var(--white);font-weight:700;}
.breset{background:rgba(230,29,37,.1);border:1px solid rgba(230,29,37,.28);border-radius:6px;padding:7px 12px;color:rgba(230,29,37,.8);font-family:var(--fc);font-size:12px;cursor:pointer;transition:all .15s;letter-spacing:.5px;}
.breset:hover{background:rgba(230,29,37,.22);}
.saved{font-family:var(--fc);font-size:11px;color:rgba(42,57,141,.7);text-align:right;padding:4px 20px 0;letter-spacing:.5px;}

/* GRID */
.content{padding:14px 20px 40px;max-width:1200px;margin:0 auto;}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}

/* CARD */
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s,transform .15s;}
.scard:hover{border-color:rgba(61,82,196,.6);transform:translateY(-1px);}
.scard.complete{border-color:var(--gold);box-shadow:0 0 14px rgba(255,219,0,.07);}
.scard.complete .shdr{background:rgba(255,219,0,.05);}
.shdr{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:rgba(0,0,0,.35);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
.sname{font-family:var(--fc);font-size:15px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:7px;}
.flag{font-size:18px;}
.sprog{display:flex;align-items:center;gap:7px;}
.pct{font-family:var(--ft);font-size:14px;color:var(--blue-light);}
.mbar{width:55px;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.mfill{height:100%;border-radius:2px;transition:width .3s;}
.cbadge{background:var(--gold);color:#0F0A1E;font-family:var(--ft);font-size:10px;padding:2px 7px;border-radius:4px;letter-spacing:1px;}
.tarrow{font-size:9px;color:rgba(42,57,141,.5);transition:transform .2s;}
.tarrow.open{transform:rotate(180deg);}
.stgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:11px 13px;}
.st{aspect-ratio:1;border-radius:5px;border:1.5px solid rgba(42,57,141,.2);display:flex;align-items:center;justify-content:center;font-family:var(--fc);font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;background:rgba(42,57,141,.06);color:rgba(255,255,255,.28);letter-spacing:.3px;position:relative;overflow:hidden;}
.st:hover{border-color:var(--blue-light);background:rgba(42,57,141,.22);color:var(--white);transform:scale(1.07);}
.st.owned{background:rgba(60,172,59,.2);border-color:var(--green);color:#6EE06D;}
.st.owned::after{content:'✓';position:absolute;top:1px;right:3px;font-size:7px;color:#6EE06D;font-weight:900;}
.sfoot{padding:7px 13px;background:rgba(0,0,0,.18);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-family:var(--fc);font-size:11px;color:rgba(255,255,255,.3);}
.co{color:#6EE06D;font-weight:700;}
.cm{color:var(--red);font-weight:700;}
.collapsed .stgrid,.collapsed .sfoot{display:none;}
.empty{text-align:center;padding:50px 20px;color:rgba(42,57,141,.5);font-family:var(--fc);font-size:17px;letter-spacing:1px;}

/* DETAIL */
.dp{background:var(--bg3);border:1px solid rgba(42,57,141,.4);border-left:4px solid var(--red);border-radius:10px;padding:16px 18px;margin-bottom:16px;}
.dp-title{font-family:var(--ft);font-size:24px;color:var(--white);letter-spacing:2px;display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.dp-title .subtitle{font-size:13px;color:rgba(255,255,255,.35);letter-spacing:1px;font-family:var(--fc);}
.dp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.dp-sc{background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:8px;padding:8px 10px;text-align:center;}
.dp-n{font-family:var(--ft);font-size:22px;line-height:1;}
.dp-l{font-family:var(--fc);font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.5px;}
.dp-pgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;}
@media(max-width:600px){.dp-pgrid{grid-template-columns:repeat(5,1fr);}.sbar{grid-template-columns:repeat(2,1fr);}}
.dp-st{aspect-ratio:1;border-radius:6px;border:1.5px solid rgba(42,57,141,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fc);font-size:9px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;background:rgba(42,57,141,.07);color:rgba(255,255,255,.28);position:relative;overflow:hidden;padding:2px;}
.dp-st:hover{border-color:var(--blue-light);background:rgba(42,57,141,.25);color:#fff;transform:scale(1.06);}
.dp-st.owned{background:rgba(60,172,59,.2);border-color:var(--green);color:#6EE06D;}
.dp-st.owned::after{content:'✓';position:absolute;top:1px;right:3px;font-size:7px;color:#6EE06D;font-weight:900;}
.dp-num{font-size:14px;font-weight:700;line-height:1.1;}
.dp-code{font-size:8px;opacity:.45;line-height:1;}
.dp-bar{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-top:12px;}
.dp-bfill{height:100%;background:linear-gradient(90deg,var(--red),var(--blue-light),var(--green));border-radius:3px;transition:width .3s;}
.dp-pct-label{font-family:var(--ft);font-size:12px;color:rgba(255,255,255,.3);margin-top:4px;letter-spacing:1.5px;}
.close-dp{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 14px;color:rgba(255,255,255,.4);font-family:var(--fc);font-size:12px;cursor:pointer;transition:all .15s;margin-top:12px;letter-spacing:.5px;}
.close-dp:hover{background:rgba(255,255,255,.1);color:#fff;}
.section-label{font-family:var(--ft);font-size:13px;color:rgba(42,57,141,.6);letter-spacing:2px;margin-bottom:10px;border-left:3px solid var(--red);padding-left:8px;}
</style>
</head>

<div id="app">
  <div class="hdr">
    <div class="htop">
      <div class="logo">FIFA<br>WORLD<br>CUP<br>2026</div>
      <div class="htitles">
        <h1>ÁLBUM MUNDIAL 2026</h1>
        <p>León Álvarez Huequelef · Registro de Láminas</p>
      </div>
    </div>
    <div class="flag-stripe">
      <div class="fs" style="background:var(--red)"></div>
      <div class="fs" style="background:var(--blue)"></div>
      <div class="fs" style="background:var(--green)"></div>
      <div class="fs" style="background:var(--gold)"></div>
      <div class="fs" style="background:var(--red)"></div>
      <div class="fs" style="background:var(--blue-light)"></div>
      <div class="fs" style="background:var(--green)"></div>
    </div>
    <div class="sbar">
      <div class="sc"><div class="sn" style="color:var(--green)" id="st-t">0</div><div class="sl">Tengo</div></div>
      <div class="sc"><div class="sn" style="color:var(--red)" id="st-f">0</div><div class="sl">Faltan</div></div>
      <div class="sc"><div class="sn" style="color:var(--gold)" id="st-p">0%</div><div class="sl">Completado</div></div>
      <div class="sc"><div class="sn" style="color:var(--blue-light)" id="st-s">0</div><div class="sl">Secciones</div></div>
    </div>
    <div class="pglobal"><div class="pfill" id="gbar" style="width:0%"></div></div>
  </div>

  <div class="ctrl">
    <input class="srch" type="text" placeholder="🔍 Buscar sección..." id="srch"/>
    <select class="csel" id="csel"><option value="">🌍 Seleccionar país...</option></select>
    <button class="fb active" data-f="all">Todas</button>
    <button class="fb red" data-f="owned">Con láminas</button>
    <button class="fb" data-f="missing">Incompletas</button>
    <button class="fb green" data-f="complete">⭐ Completas</button>
    <button class="breset" id="breset">↺ Reiniciar</button>
  </div>
  <div class="saved" id="saved-msg">Cargando...</div>

  <div class="content">
    <div id="dp-container"></div>
    <div id="grid-label" class="section-label" style="display:none"></div>
    <div class="sgrid" id="grid"></div>
  </div>
</div>

const SK='mundial2026_v3';
let state={},collapsed={},filterMode='all',searchQ='',selectedCountry='',saveTimer=null;

function getOwned(n){const s=state[n];if(!s)return new Set();return s instanceof Set?s:new Set(s);}

function loadState(){
  try{
    const raw=localStorage.getItem(SK);
    if(raw){const d=JSON.parse(raw);state=d.state||{};collapsed=d.collapsed||{};}
    else initDef();
  }catch{initDef();}
  DATA.forEach(s=>{
    if(state[s.name]&&!(state[s.name] instanceof Set))state[s.name]=new Set(state[s.name]);
    else if(!state[s.name])state[s.name]=new Set(s.init);
  });
}

function initDef(){state={};DATA.forEach(s=>{state[s.name]=new Set(s.init);});}

function saveState(){
  const t={};for(const[k,v]of Object.entries(state))t[k]=v instanceof Set?[...v]:v;
  try{
    localStorage.setItem(SK,JSON.stringify({state:t,collapsed}));
    document.getElementById('saved-msg').textContent='✓ Guardado · '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  }catch{document.getElementById('saved-msg').textContent='⚠ No se pudo guardar';}
}
function qSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveState,600);}

function updateStats(){
  let tot=0,own=0;DATA.forEach(s=>{tot+=s.codes.length;own+=getOwned(s.name).size;});
  const pct=tot?Math.round(own/tot*100):0;
  document.getElementById('st-t').textContent=own;
  document.getElementById('st-f').textContent=tot-own;
  document.getElementById('st-p').textContent=pct+'%';
  document.getElementById('st-s').textContent=DATA.length;
  document.getElementById('gbar').style.width=pct+'%';
}

function populateSel(){
  const sel=document.getElementById('csel');
  DATA.forEach(s=>{const o=document.createElement('option');o.value=s.name;o.textContent=(FLAGS[s.name]||'🌍')+' '+s.name;sel.appendChild(o);});
}

function renderDetail(name){
  const c=document.getElementById('dp-container');
  if(!name){c.innerHTML='';return;}
  const sec=DATA.find(s=>s.name===name);if(!sec){c.innerHTML='';return;}
  const owned=getOwned(name),total=sec.codes.length,cnt=owned.size;
  const pct=total?Math.round(cnt/total*100):0,flag=FLAGS[name]||'🌍';
  const stHTML=sec.codes.map(code=>{
    const num=code.split(' ')[1]||code,pre=code.split(' ')[0];
    return `<div class="dp-st${owned.has(code)?' owned':''}" data-code="${code}" data-sec="${name}"><span class="dp-num">${num}</span><span class="dp-code">${pre}</span></div>`;
  }).join('');
  c.innerHTML=`<div class="dp">
    <div class="dp-title"><span style="font-size:30px">${flag}</span>${name.toUpperCase()}<span class="subtitle">· ${total} LÁMINAS</span></div>
    <div class="dp-stats">
      <div class="dp-sc"><div class="dp-n" style="color:#3CAC3B">${cnt}</div><div class="dp-l">Tengo</div></div>
      <div class="dp-sc"><div class="dp-n" style="color:#E61D25">${total-cnt}</div><div class="dp-l">Faltan</div></div>
      <div class="dp-sc"><div class="dp-n" style="color:#FFDB00">${pct}%</div><div class="dp-l">Progreso</div></div>
    </div>
    <div class="dp-pgrid">${stHTML}</div>
    <div class="dp-bar"><div class="dp-bfill" style="width:${pct}%"></div></div>
    <div class="dp-pct-label">${pct}% COMPLETADO · ${cnt} DE ${total} LÁMINAS</div>
    <button class="close-dp" id="cdp">✕ Cerrar</button>
  </div>`;
  c.querySelectorAll('.dp-st').forEach(el=>{
    el.addEventListener('click',()=>{
      const o=getOwned(el.dataset.sec);
      if(o.has(el.dataset.code))o.delete(el.dataset.code);else o.add(el.dataset.code);
      state[el.dataset.sec]=o;qSave();updateStats();renderDetail(selectedCountry);updateCard(el.dataset.sec);
    });
  });
  document.getElementById('cdp').addEventListener('click',()=>{selectedCountry='';document.getElementById('csel').value='';renderDetail('');});
}

function updateCard(name){
  const owned=getOwned(name),sec=DATA.find(s=>s.name===name);if(!sec)return;
  const total=sec.codes.length,cnt=owned.size,pct=total?Math.round(cnt/total*100):0;
  const card=document.querySelector(`[data-sec="${CSS.escape(name)}"]`);if(!card)return;
  card.querySelector('.pct').textContent=pct+'%';
  card.querySelector('.mfill').style.width=pct+'%';
  card.querySelector('.mfill').style.background=pct===100?'#FFDB00':pct>=60?'#3CAC3B':pct>=30?'#3D52C4':'#E61D25';
  card.querySelector('.co').textContent=cnt;card.querySelector('.cm').textContent=total-cnt;
  card.classList.toggle('complete',cnt===total);
  const cb=card.querySelector('.cbadge');if(cb)cb.style.display=cnt===total?'inline-block':'none';
  card.querySelectorAll('.st').forEach(el=>{el.classList.toggle('owned',owned.has(el.dataset.code));});
}

function buildCard(sec){
  const name=sec.name,owned=getOwned(name),total=sec.codes.length,cnt=owned.size;
  const pct=total?Math.round(cnt/total*100):0,complete=cnt===total,flag=FLAGS[name]||'🌍',isCol=!!collapsed[name];
  const barC=pct===100?'#FFDB00':pct>=60?'#3CAC3B':pct>=30?'#3D52C4':'#E61D25';
  const div=document.createElement('div');
  div.className='scard'+(complete?' complete':'')+(isCol?' collapsed':'');div.dataset.sec=name;
  const stHTML=sec.codes.map(code=>`<div class="st${owned.has(code)?' owned':''}" data-code="${code}" title="${code}">#${code.split(' ')[1]}</div>`).join('');
  div.innerHTML=`<div class="shdr">
    <div class="sname"><span class="flag">${flag}</span><span>${name}</span></div>
    <div class="sprog">
      <span class="cbadge" style="display:${complete?'inline-block':'none'}">COMPLETA</span>
      <span class="pct">${pct}%</span>
      <div class="mbar"><div class="mfill" style="width:${pct}%;background:${barC}"></div></div>
      <span class="tarrow${isCol?'':' open'}">▼</span>
    </div>
  </div>
  <div class="stgrid">${stHTML}</div>
  <div class="sfoot">
    <span><span class="co">${cnt}</span> pegadas · <span class="cm">${total-cnt}</span> faltan</span>
    <span style="color:rgba(61,82,196,.4)">${total} total</span>
  </div>`;
  div.querySelector('.shdr').addEventListener('click',()=>{
    collapsed[name]=!collapsed[name];qSave();
    div.classList.toggle('collapsed',!!collapsed[name]);div.querySelector('.tarrow').classList.toggle('open',!collapsed[name]);
  });
  div.querySelectorAll('.st').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();const o=getOwned(name);
      if(o.has(el.dataset.code))o.delete(el.dataset.code);else o.add(el.dataset.code);
      state[name]=o;qSave();updateStats();if(selectedCountry===name)renderDetail(name);updateCard(name);
    });
  });
  return div;
}

function getFiltered(){
  let s=DATA;
  if(searchQ)s=s.filter(x=>x.name.toLowerCase().includes(searchQ.toLowerCase()));
  if(filterMode==='owned')s=s.filter(x=>getOwned(x.name).size>0);
  if(filterMode==='missing')s=s.filter(x=>{const c=getOwned(x.name).size;return c>0&&c<x.codes.length;});
  if(filterMode==='complete')s=s.filter(x=>getOwned(x.name).size===x.codes.length);
  return s;
}

function renderAll(){
  const grid=document.getElementById('grid');grid.innerHTML='';
  const label=document.getElementById('grid-label');
  const secs=getFiltered();
  if(!secs.length){grid.innerHTML='<div class="empty">NO HAY SECCIONES QUE MOSTRAR</div>';label.style.display='none';return;}
  label.style.display='block';
  label.textContent=secs.length+' SECCIÓN'+(secs.length!==1?'ES':'')+' · '+secs.reduce((a,s)=>a+s.codes.length,0)+' LÁMINAS';
  secs.forEach(sec=>grid.appendChild(buildCard(sec)));
}

document.querySelectorAll('.fb[data-f]').forEach(b=>{
  b.addEventListener('click',()=>{document.querySelectorAll('.fb[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filterMode=b.dataset.f;renderAll();});
});
document.getElementById('srch').addEventListener('input',e=>{searchQ=e.target.value;document.getElementById('csel').value='';selectedCountry='';renderDetail('');renderAll();});
document.getElementById('csel').addEventListener('change',e=>{
  selectedCountry=e.target.value;searchQ='';document.getElementById('srch').value='';renderDetail(selectedCountry);
  if(selectedCountry){const c=document.querySelector(`[data-sec="${CSS.escape(selectedCountry)}"]`);if(c)c.scrollIntoView({behavior:'smooth',block:'nearest'});}
});
document.getElementById('breset').addEventListener('click',()=>{
  if(!confirm('¿Reiniciar el álbum desde cero? Se perderá todo el progreso.'))return;
  initDef();saveState();updateStats();renderDetail(selectedCountry);renderAll();
});

loadState();
populateSel();
updateStats();
renderAll();
document.getElementById('saved-msg').textContent='Datos cargados · haz clic en una lámina para marcarla';
</script>
